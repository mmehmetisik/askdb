<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giris Yap | Text - SQL Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗄️</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-card { max-width: 400px; text-align: center; }
        .input-group { margin-bottom: 1.5rem; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); }
        .login-input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); padding: 12px; border-radius: 12px; color: white; }
        .login-input:focus { border-color: var(--accent-primary); outline: none; }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    <div class="page-center">
    <div class="card login-card fade-in">
        <h1><i class="fas fa-lock text-gradient"></i> <span data-i18n="login.title">Giris Yap</span></h1>
        <p class="description" style="margin-bottom: 2rem;" data-i18n="login.subtitle">Devam etmek icin kimliginizi dogrulayin.</p>

        <form id="loginForm">
            <div class="input-group">
                <label data-i18n="login.username">Kullanici Adi</label>
                <input type="text" id="username" class="login-input" required placeholder="Kullanici adiniz" data-i18n-placeholder="login.usernamePlaceholder">
            </div>
            <div class="input-group">
                <label data-i18n="login.password">Sifre</label>
                <input type="password" id="password" class="login-input" required placeholder="--------">
            </div>
            <button type="submit" id="loginBtn" data-i18n-html="login.submit">Giris Yap <i class="fas fa-arrow-right"></i></button>
            <div id="loginError" style="color: #fca5a5; margin-top: 15px; font-size: 0.9rem; display: none;"></div>
        </form>
        <button class="btn-lang" id="langToggle" onclick="toggleLang()" style="margin-top:1rem;background:none;border:1px solid var(--border-color);color:var(--text-muted);padding:4px 12px;border-radius:8px;font-size:0.75rem;cursor:pointer;">TR / EN</button>
    </div>
    </div>

    <script src="js/i18n.js?v=1.0.0"></script>
    <script>
        const API_BASE = "";

        function toggleLang() {
            I18n.setLang(I18n.getLang() === 'tr' ? 'en' : 'tr');
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const err = document.getElementById('loginError');
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + t('common.wait');
            err.style.display = "none";

            try {
                const response = await fetch(API_BASE + "/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ username: u, password: p })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('username', data.username);
                    localStorage.setItem('trino_access', data.trino_access ? 'true' : 'false');

                    if (data.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else if (data.role === 'reporter' || data.role === 'data_scientist') {
                        window.location.href = 'analysis.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    err.textContent = data.detail || data.message || t('login.failed');
                    err.style.display = "block";
                }
            } catch (error) {
                err.textContent = t('common.connectionError');
                err.style.display = "block";
            } finally {
                loginBtn.disabled = false;
                loginBtn.innerHTML = t('login.submit') + ' <i class="fas fa-arrow-right"></i>';
            }
        });
    </script>
</body>
</html>
