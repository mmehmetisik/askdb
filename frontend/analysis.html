<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analiz Workspace | AskDB</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css?v=1.0.3" />
  <link rel="stylesheet" href="analysis.css?v=1.0.3" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script>
    if (!localStorage.getItem('isLoggedIn')) window.location.href = 'login.html';
    var _role = localStorage.getItem('role');
    if (_role !== 'reporter' && _role !== 'data_scientist' && _role !== 'admin') {
      window.location.href = 'index.html';
    }
    if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');
  </script>
</head>
<body>

<div class="analysis-layout">
  <!-- ============ LEFT SIDEBAR: Reports ============ -->
  <aside class="analysis-sidebar" id="analysisSidebar">
    <div class="sidebar-header">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <h1><i class="fas fa-chart-bar"></i> <span class="text-gradient sidebar-text" data-i18n="analysis.title">Analiz</span></h1>
        <button class="btn-sidebar-toggle" id="sidebarToggleBtn" onclick="toggleAnalysisSidebar()" title="Paneli daralt">
          <i class="fas fa-angle-double-left"></i>
        </button>
      </div>
      <div class="subtitle sidebar-text" data-i18n="analysis.subtitle">Data Analysis Workspace</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-header">
        <div class="sidebar-section-title">
          <i class="fas fa-folder-open"></i> <span data-i18n="report.myReports">Raporlarim</span>
          <span class="report-badge" id="reportBadge" style="display:none;">0</span>
        </div>
        <button class="btn-refresh-schema" onclick="loadReports()" data-i18n-title="common.refresh" title="Yenile">
          <i class="fas fa-sync-alt"></i>
        </button>
      </div>
      <div id="reportList" class="report-list">
        <div class="schema-loading"><i class="fas fa-circle-notch fa-spin"></i> <span data-i18n="common.loading">Yukleniyor...</span></div>
      </div>
    </div>


    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">R</div>
        <div>
          <div class="user-name" id="userName">reporter</div>
          <div class="user-role" id="userRole">Reporter</div>
        </div>
      </div>
      <div class="sidebar-actions">
        <a href="ml.html" class="btn-theme" id="mlNavBtn" data-i18n-title="ml.analysisPage" title="ML Studio" style="text-decoration:none;display:none;">
          <i class="fas fa-brain"></i>
        </a>
        <button class="btn-theme" onclick="I18n.setLang(I18n.getLang()==='tr'?'en':'tr')" title="TR/EN" style="font-size:0.65rem;">TR/EN</button>
        <button class="btn-theme" onclick="toggleThemeAnalysis()" id="themeToggleBtn" title="Dark/Light">
          <i class="fas fa-moon"></i>
        </button>
        <button class="btn-logout" onclick="logoutAnalysis()"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN CONTENT ============ -->
  <main class="analysis-main">
    <!-- Report Header -->
    <div class="analysis-header" id="analysisHeader">
      <div class="analysis-header-left">
        <div class="analysis-title-row">
          <h2 id="reportHeaderTitle"><i class="fas fa-chart-bar"></i> <span data-i18n="analysis.title">Analiz</span> Workspace</h2>
          <span class="report-status-badge" id="reportStatusBadge" style="display:none;" data-i18n="analysis.statusNew">Yeni</span>
        </div>
        <span class="report-meta" id="reportMeta"></span>
      </div>
      <div class="analysis-header-right" id="reportActions" style="display:none;">
        <button class="btn-sm" onclick="markInProgress()"><i class="fas fa-play"></i> <span data-i18n="analysis.start">Baslat</span></button>
        <button class="btn-sm" onclick="markCompleted()"><i class="fas fa-check"></i> <span data-i18n="analysis.complete">Tamamla</span></button>
      </div>
    </div>

    <!-- Empty State -->
    <div class="analysis-empty" id="analysisEmpty">
      <i class="fas fa-chart-pie"></i>
      <h3 data-i18n="analysis.selectReport">Bir rapor secin</h3>
      <p data-i18n="analysis.selectReportDesc">Soldaki listeden analiz etmek istediginiz raporu secin.</p>
    </div>

    <!-- Workspace Content (hidden until report selected) -->
    <div class="analysis-workspace" id="analysisWorkspace" style="display:none;">

      <!-- EDA Toolbar -->
      <div class="eda-toolbar">
        <div class="eda-tabs">
          <button class="eda-tab active" data-tab="overview" onclick="switchEdaTab('overview')">
            <i class="fas fa-tachometer-alt"></i> <span data-i18n="analysis.tabs.overview">Ozet</span>
          </button>
          <button class="eda-tab" data-tab="distribution" onclick="switchEdaTab('distribution')">
            <i class="fas fa-chart-bar"></i> <span data-i18n="analysis.tabs.distribution">Dagilim</span>
          </button>
          <button class="eda-tab" data-tab="cleaning" onclick="switchEdaTab('cleaning')">
            <i class="fas fa-broom"></i> <span data-i18n="analysis.tabs.cleaning">Temizleme</span>
          </button>
          <button class="eda-tab" data-tab="correlation" onclick="switchEdaTab('correlation')">
            <i class="fas fa-project-diagram"></i> <span data-i18n="analysis.tabs.correlation">Korelasyon</span>
          </button>
          <button class="eda-tab" data-tab="chart" onclick="switchEdaTab('chart')">
            <i class="fas fa-chart-pie"></i> <span data-i18n="analysis.tabs.chart">Grafik</span>
          </button>
        </div>
        <div class="eda-actions">
          <button class="btn-sm" onclick="exportAnalysisExcel()"><i class="fas fa-file-excel"></i> <span data-i18n="export.excel">Excel</span></button>
          <button class="btn-sm" onclick="exportAnalysisPDF()"><i class="fas fa-file-pdf"></i> <span data-i18n="export.pdf">PDF</span></button>
          <button class="btn-sm btn-send-ml" onclick="openSendToMLModal()"><i class="fas fa-brain"></i> <span data-i18n="analysis.sendToML">ML'e Gonder</span></button>
        </div>
      </div>

      <!-- EDA Content Panels -->
      <div class="eda-content">
        <div class="eda-panel active" id="edaOverview"></div>
        <div class="eda-panel" id="edaDistribution"></div>
        <div class="eda-panel" id="edaCleaning"></div>
        <div class="eda-panel" id="edaCorrelation"></div>
        <div class="eda-panel" id="edaChart"></div>
      </div>

      <!-- Data Table -->
      <div class="analysis-table-section">
        <div class="analysis-table-toolbar">
          <div class="table-search">
            <i class="fas fa-search"></i>
            <input type="text" id="aTableSearch" data-i18n-placeholder="analysis.searchTable" placeholder="Tabloda ara..." oninput="filterAnalysisTable()">
          </div>
          <div class="analysis-table-actions">
            <span class="row-indicator" id="aRowCount"></span>
          </div>
        </div>
        <div class="analysis-table-wrapper">
          <div id="analysisTableContainer"></div>
        </div>
        <div id="paginationContainer"></div>
      </div>

      <!-- Operation History Panel -->
      <div class="op-history-panel" id="operationHistoryPanel">
        <div class="op-history-header">
          <h4><i class="fas fa-history"></i> <span data-i18n="analysis.opHistory">Islem Gecmisi</span></h4>
        </div>
        <div id="operationHistory"></div>
      </div>
    </div>
  </main>
</div>

<!-- Duplike Satir Inceleme Modal -->
<div class="modal-overlay" id="dupModal" style="display:none;" onclick="if(event.target===this)closeDupModal()">
  <div class="modal-card" style="max-width:720px;width:90%;">
    <div class="modal-header">
      <h3><i class="fas fa-clone" style="color:var(--accent-primary);"></i> Duplike Satirlar</h3>
      <button class="modal-close" onclick="closeDupModal()">&times;</button>
    </div>
    <div class="modal-body" style="padding:0;">
      <div id="dupModalInfo" style="padding:12px 20px;font-size:0.82rem;color:var(--text-muted);border-bottom:1px solid var(--border-color);"></div>
      <div id="dupModalTable" style="max-height:360px;overflow:auto;padding:0;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeDupModal()">Iptal</button>
      <button class="btn-danger" id="dupModalDeleteBtn" onclick="confirmDupDelete()">
        <i class="fas fa-broom"></i> Duplikeleri Sil
      </button>
    </div>
  </div>
</div>

<script src="js/i18n.js?v=1.0.3"></script>
<script src="js/store.js?v=1.0.3"></script>
<script src="js/helpers.js?v=1.0.3"></script>
<script src="js/analysis-app.js?v=1.0.3"></script>
<script src="js/eda-engine.js?v=1.0.3"></script>
<script src="js/eda-render.js?v=1.0.3"></script>
<script src="js/data-cleaning.js?v=1.0.3"></script>
<script src="js/column-filter.js?v=1.0.3"></script>
<script src="js/chart-panel.js?v=1.0.3"></script>
<script src="js/ml-sender.js?v=1.0.3"></script>
</body>
</html>
